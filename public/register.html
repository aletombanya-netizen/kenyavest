<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — KenyaVest</title>
  <meta name="description" content="Join KenyaVest — Kenya's #1 investment platform. Create your free account and start earning daily returns via M-Pesa.">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#F4C430" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #F4C430;
      --gold-dark: #D4A017;
      --gold-glow: rgba(244,196,48,.30);
      --navy: #0B1120;
      --navy2: #111928;
      --navy3: #1A2235;
      --text: #e8eaf0;
      --muted: #8b9ab8;
      --border: rgba(255,255,255,.1);
      --green: #16a34a;
      --green-glow: rgba(22,163,74,.30);
      --red: #ef4444;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--navy);
      background-image:
        radial-gradient(ellipse at 75% 10%, rgba(244,196,48,.08) 0%, transparent 55%),
        radial-gradient(ellipse at 15% 85%, rgba(37,99,235,.10)  0%, transparent 50%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    /* Animated ambient orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: drift 14s ease-in-out infinite;
    }
    .orb1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(244,196,48,.10) 0%, transparent 65%); top: -180px; right: -120px; }
    .orb2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(37,99,235,.10)  0%, transparent 65%); bottom: -100px; left: -100px; animation-delay: -7s; }
    @keyframes drift { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(20px,-25px) scale(1.04); } }

    /* Card */
    .card {
      background: rgba(17,25,40,.9);
      border: 1px solid rgba(244,196,48,.18);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 24px 80px rgba(0,0,0,.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: relative;
      z-index: 1;
      animation: cardIn .55s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes cardIn { from { transform: scale(.94) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }

    /* Logo */
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
      text-decoration: none;
    }
    .logo img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; }
    .logo-text { font-size: 1.5rem; font-weight: 800; color: #fff; letter-spacing: -.01em; }
    .logo-text span { color: var(--gold); }

    /* Section headings */
    .step-icon {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: rgba(244,196,48,.12);
      border: 1px solid rgba(244,196,48,.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      margin: 0 auto 16px;
    }
    h2 {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: .85rem;
      margin-bottom: 24px;
      line-height: 1.55;
    }

    /* Messages */
    .msg {
      text-align: center;
      font-size: .85rem;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
      line-height: 1.45;
    }
    .msg.error   { background: rgba(239,68,68,.12);  color: #f87171;  border: 1px solid rgba(239,68,68,.3); }
    .msg.success { background: rgba(22,163,74,.12);  color: #4ade80;  border: 1px solid rgba(22,163,74,.3); }
    .msg.warning { background: rgba(234,179,8,.10); color: #facc15; border: 1px solid rgba(234,179,8,.3); }

    /* Form */
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: .75rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .5px;
      text-transform: uppercase;
    }
    .form-group input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #2d3748;
      border-radius: 10px;
      background: rgba(6,12,26,.8);
      color: var(--text);
      font-size: .95rem;
      font-family: 'Poppins', sans-serif;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    .form-group input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }
    .form-group input::placeholder { color: rgba(139,154,184,.5); }

    /* Password wrapper */
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 46px; }
    .eye-btn {
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer; font-size: 1rem;
      color: var(--muted);
      transition: color .2s;
      line-height: 1;
      padding: 0;
    }
    .eye-btn:hover { color: var(--text); }

    /* OTP input */
    .otp-input {
      font-size: 1.8rem !important;
      letter-spacing: 14px !important;
      text-align: center !important;
      font-weight: 700 !important;
    }

    /* Terms checkbox */
    .form-chk {
      display: flex;
      align-items: flex-start;
      gap: .6rem;
      font-size: .82rem;
      color: var(--muted);
      margin-bottom: 18px;
    }
    .form-chk input[type="checkbox"] { margin-top: 3px; accent-color: var(--green); flex-shrink: 0; }
    .form-chk a { color: var(--gold); text-decoration: none; }
    .form-chk a:hover { text-decoration: underline; }

    /* Primary button */
    .btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #0a0f22;
      border: none;
      border-radius: 10px;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      font-family: 'Poppins', sans-serif;
      letter-spacing: .02em;
    }
    .btn:hover { box-shadow: 0 0 24px rgba(244,196,48,.5); transform: translateY(-1px); }
    .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Footer link */
    .links {
      text-align: center;
      margin-top: 20px;
      font-size: .85rem;
      color: var(--muted);
    }
    .links a { color: var(--gold); font-weight: 600; text-decoration: none; }
    .links a:hover { text-decoration: underline; }

    .resend-row { text-align: center; margin-top: 14px; font-size: .85rem; color: var(--muted); }
    .resend-row a { color: var(--gold); font-weight: 600; cursor: pointer; text-decoration: none; }
    .resend-row a:hover { text-decoration: underline; }

    /* Section toggle */
    .section { display: none; }
    .section.active { display: block; }

    /* Trust strip */
    .trust-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      flex-wrap: wrap;
      margin-top: 20px;
      font-size: .72rem;
      color: var(--muted);
    }
    .trust-dot { color: rgba(255,255,255,.2); }

    @media (max-width: 480px) {
      .card { padding: 32px 22px; }
    }
  </style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="card">

  <a href="/" class="logo">
    <img src="/icon-192.png" alt="KenyaVest" />
    <span class="logo-text">Kenya<span>Vest</span></span>
  </a>

  <div id="msgBox" class="msg"></div>

  <!-- ── REGISTER SECTION ── -->
  <div id="registerSection" class="section active">
    <div class="step-icon">🚀</div>
    <h2>Create Free Account</h2>
    <p class="subtitle">Join 50,000+ Kenyans earning daily returns</p>

    <form id="registerForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="John Doe" required autocomplete="name">
      </div>
      <div class="form-group">
        <label for="phone">M-Pesa Phone Number</label>
        <input type="tel" id="phone" placeholder="e.g. 0712345678" required autocomplete="tel">
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="Min. 8 characters" required autocomplete="new-password">
          <button type="button" class="eye-btn" onclick="togglePw('password')" aria-label="Toggle password">👁</button>
        </div>
      </div>
      <div class="form-chk">
        <input type="checkbox" id="chkTerms" required>
        <label for="chkTerms">I agree to the <a href="/terms.html" target="_blank">Terms of Service</a> and <a href="/privacy.html" target="_blank">Privacy Policy</a></label>
      </div>
      <button type="submit" class="btn" id="signupBtn">Create Account →</button>
    </form>

    <div class="links">
      Already have an account? <a href="/login.html">Login</a>
    </div>

    <div class="trust-strip">
      <span>🔒 SSL Secured</span>
      <span class="trust-dot">•</span>
      <span>⚡ Instant M-Pesa</span>
      <span class="trust-dot">•</span>
      <span>✅ Free to Join</span>
    </div>
  </div>

  <!-- ── OTP SECTION ── -->
  <div id="otpSection" class="section">
    <div class="step-icon">✉️</div>
    <h2>Verify Your Email</h2>
    <p class="subtitle" id="otpSubtitle">Enter the 6-digit OTP sent to your email.</p>

    <div id="otpHint" style="display:none;background:rgba(244,196,48,0.1);border:1px solid rgba(244,196,48,0.3);border-radius:8px;padding:10px 14px;margin-bottom:16px;color:#F4C430;font-size:.9rem;font-weight:600;text-align:center;letter-spacing:1px;"></div>

    <form id="otpForm">
      <div class="form-group">
        <label for="otpCode">OTP Code</label>
        <input type="text" id="otpCode" class="otp-input" maxlength="6" placeholder="000000" required autocomplete="one-time-code">
      </div>
      <button type="submit" class="btn" id="verifyBtn">Verify &amp; Continue →</button>
    </form>

    <div class="resend-row">
      Didn't get the code? <a id="resendOtpBtn">Resend OTP</a>
    </div>
    <div class="links" style="margin-top:12px">
      <a href="/register.html">← Back to Registration</a>
    </div>
  </div>

</div>

<script>
  let currentEmail = '';

  function showMsg(text, type) {
    const box = document.getElementById('msgBox');
    box.textContent = text;
    box.className = 'msg ' + type;
    box.style.display = 'block';
  }
  function hideMsg() {
    document.getElementById('msgBox').style.display = 'none';
  }

  function togglePw(id) {
    const inp = document.getElementById(id);
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  // ── REGISTER ──────────────────────────────────────────────────────────
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name     = document.getElementById('name').value.trim();
    const phone    = document.getElementById('phone').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('signupBtn');

    if (!name || !phone || !email || !password) return showMsg('❌ Please fill in all required fields.', 'error');
    if (password.length < 8) return showMsg('❌ Password must be at least 8 characters.', 'error');

    btn.disabled = true; btn.textContent = 'Creating account…';
    hideMsg();

    try {
      const res  = await fetch('/api/auth/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone, email, password })
      });
      const data = await res.json();

      if (res.ok || res.status === 201) {
        currentEmail = email;
        showMsg('✅ Account created! Check your email for the OTP.', 'success');
        document.getElementById('otpSubtitle').textContent = `A 6-digit code has been sent to ${email}.`;
        // Check if OTP hint in response (dev mode)
        if (data.message) {
          const match = data.message.match(/\b(\d{6})\b/);
          if (match) {
            const hint = document.getElementById('otpHint');
            hint.textContent = '🔑 Your OTP: ' + match[1];
            hint.style.display = 'block';
          }
        }
        setTimeout(() => {
          hideMsg();
          document.getElementById('registerSection').classList.remove('active');
          document.getElementById('otpSection').classList.add('active');
        }, 1000);
      } else {
        showMsg('❌ ' + (data.message || 'Registration failed.'), 'error');
        btn.disabled = false; btn.textContent = 'Create Account →';
      }
    } catch (err) {
      showMsg('❌ Network error. Please try again.', 'error');
      btn.disabled = false; btn.textContent = 'Create Account →';
    }
  });

  // ── OTP VERIFY ────────────────────────────────────────────────────────
  document.getElementById('otpForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = document.getElementById('otpCode').value.trim();
    if (!code || code.length !== 6) return showMsg('❌ Enter the full 6-digit code.', 'error');
    const btn = document.getElementById('verifyBtn');
    btn.disabled = true; btn.textContent = 'Verifying…';
    hideMsg();

    try {
      const res  = await fetch('/api/auth/verify-phone', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: currentEmail, code })
      });
      const data = await res.json();

      if (res.ok) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('userInfo', JSON.stringify(data));
        showMsg('✅ Email verified! Redirecting to your dashboard…', 'success');
        setTimeout(() => window.location.href = '/dashboard.html', 1200);
      } else {
        showMsg('❌ ' + (data.message || 'Verification failed.'), 'error');
        btn.disabled = false; btn.textContent = 'Verify & Continue →';
      }
    } catch (err) {
      showMsg('❌ Network error. Please try again.', 'error');
      btn.disabled = false; btn.textContent = 'Verify & Continue →';
    }
  });

  // ── RESEND OTP ────────────────────────────────────────────────────────
  document.getElementById('resendOtpBtn').addEventListener('click', async () => {
    if (!currentEmail) return;
    try {
      const res  = await fetch('/api/auth/resend-otp', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: currentEmail })
      });
      const data = await res.json();
      showMsg(
        res.ok ? '✅ New OTP sent! Check your email.' : '❌ ' + (data.message || 'Failed to resend.'),
        res.ok ? 'success' : 'error'
      );
    } catch {
      showMsg('❌ Network error.', 'error');
    }
  });
</script>
<script src="/js/pwa.js"></script>
</body>
</html>
